name: Update IPO Dashboard

on:
  schedule:
    # Every 2 hours between 7am–7pm IST (1:30–13:30 UTC) on weekdays
    - cron: '30 1,3,5,7,9,11,13 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate IPO dashboard
        run: python python_files/ipo_tracker.py --output-html docs/index.html

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || (
            git commit -m "chore: update IPO data [skip ci]" &&
            git push
          )
